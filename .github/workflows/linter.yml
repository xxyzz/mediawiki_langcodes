name: Lint Code Base

on:
  workflow_dispatch:
  push:
    branches:  # ignore pushed tags
      - "*"
    paths:
      - '**.py'
      - '**.md'
  pull_request:
    paths:
      - '**.py'
      - '**.md'

permissions:
  contents: read

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: uv sync --locked --extra dev
      - run: uv tool install ruff
      - run: uv tool run ruff check --output-format=github .
      - run: uv tool run ruff format --check --output-format=github .
      - run: uv tool install ty
      - run: uv tool run ty check --output-format github
